[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "Jomini"
version = "1.1.0"
description = "Lanchester-type combat models for simulating historical and fictional battles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ümit Kaan Usta", email = "u.kaanusta@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "typing_extensions>=4.0; python_version < '3.11'"]
keywords = ["military", "battle", "combat", "history", "simulation", "lanchester", "attrition", "operations-research"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Games/Entertainment :: Simulation",
  "Typing :: Typed",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
pandas = ["pandas>=2.0"]
mcp = [
    "mcp>=2.3",
]

[project.scripts]
jomini-mcp = "jomini.mcp_server:main"

[project.urls]
Homepage = "https://github.com/umitkaanusta/Jomini"
Issues = "https://github.com/umitkaanusta/Jomini/issues"

[dependency-groups]
bench = [
    "anthropic>=1.0",
]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/jomini"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
